<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 500"
    width="500"
    height="500"
>

    <defs>

        <!-- Cuerpo de la luna -->
        <linearGradient
            id="moonGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#FFF8D8"/>
            <stop offset="48%" stop-color="#F7D98A"/>
            <stop offset="100%" stop-color="#DDAE55"/>
        </linearGradient>

        <!-- Brillo -->
        <radialGradient id="moonGlow">
            <stop offset="0%" stop-color="#FFF7D0" stop-opacity=".55"/>
            <stop offset="65%" stop-color="#FFE8A0" stop-opacity=".18"/>
            <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
        </radialGradient>

        <filter
            id="softShadow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >
            <feGaussianBlur
                in="SourceAlpha"
                stdDeviation="8"
            />

            <feOffset
                dy="8"
            />

            <feComponentTransfer>
                <feFuncA
                    type="linear"
                    slope=".22"
                />
            </feComponentTransfer>

            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>


    <!-- =====================================================
         HALO
         ===================================================== -->

    <circle
        cx="250"
        cy="250"
        r="210"
        fill="url(#moonGlow)"
    />


    <!-- =====================================================
         LUNA CRECIENTE
         ===================================================== -->

    <path
        id="moon-body"
        d="
            M 345 70

            C 250 75
              175 150
              175 250

            C 175 355
              255 430
              355 430

            C 405 430
              447 411
              475 380

            C 435 397
              390 385
              360 355

            C 315 311
              305 245
              322 188

            C 337 135
              370 94
              415 72

            C 392 69
              369 68
              345 70

            Z
        "
        fill="url(#moonGradient)"
        filter="url(#softShadow)"
    />


    <!-- =====================================================
         CRÁTERES SUAVES
         ===================================================== -->

    <g
        id="moon-craters"
        fill="#D7AA5B"
        opacity=".22"
    >

        <ellipse
            cx="245"
            cy="165"
            rx="17"
            ry="10"
        />

        <ellipse
            cx="210"
            cy="225"
            rx="11"
            ry="7"
        />

        <ellipse
            cx="270"
            cy="285"
            rx="14"
            ry="9"
        />

        <ellipse
            cx="220"
            cy="335"
            rx="9"
            ry="6"
        />

        <circle
            cx="300"
            cy="130"
            r="7"
        />

        <circle
            cx="185"
            cy="275"
            r="6"
        />

    </g>


    <!-- =====================================================
         BEBÉ DORMIDO
         ===================================================== -->

    <g
        id="sleeping-baby"
        transform="translate(0 5)"
    >

        <!-- Cabecita -->
        <ellipse
            cx="250"
            cy="245"
            rx="52"
            ry="43"
            fill="#F7D9A2"
        />

        <!-- Mejillas -->
        <ellipse
            cx="225"
            cy="267"
            rx="13"
            ry="7"
            fill="#EFAE9C"
            opacity=".55"
        />

        <ellipse
            cx="275"
            cy="267"
            rx="13"
            ry="7"
            fill="#EFAE9C"
            opacity=".55"
        />

        <!-- Ojo izquierdo -->
        <path
            d="M 218 246 Q 228 255 238 246"
            fill="none"
            stroke="#6B594A"
            stroke-width="4"
            stroke-linecap="round"
        />

        <!-- Ojo derecho -->
        <path
            d="M 262 246 Q 272 255 282 246"
            fill="none"
            stroke="#6B594A"
            stroke-width="4"
            stroke-linecap="round"
        />

        <!-- Nariz -->
        <path
            d="M 247 257 Q 250 260 253 257"
            fill="none"
            stroke="#B68169"
            stroke-width="2.5"
            stroke-linecap="round"
        />

        <!-- Boca -->
        <path
            d="M 241 268 Q 250 276 259 268"
            fill="none"
            stroke="#8C6657"
            stroke-width="3"
            stroke-linecap="round"
        />

        <!-- Pelito -->
        <path
            d="
                M 215 220
                Q 220 205 234 201
                Q 250 195 267 201
                Q 280 205 286 218
            "
            fill="none"
            stroke="#C28C5D"
            stroke-width="5"
            stroke-linecap="round"
        />

    </g>


    <!-- =====================================================
         PEQUEÑOS DESTELLOS DE LA LUNA
         ===================================================== -->

    <g
        id="moon-sparkles"
        fill="#FFF3B8"
    >

        <path
            d="
                M 135 190
                L 139 202
                L 151 206
                L 139 210
                L 135 222
                L 131 210
                L 119 206
                L 131 202
                Z
            "
        />

        <path
            d="
                M 365 145
                L 368 154
                L 377 157
                L 368 160
                L 365 169
                L 362 160
                L 353 157
                L 362 154
                Z
            "
        />

    </g>

</svg>