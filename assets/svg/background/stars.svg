<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1920 1080"
    width="1920"
    height="1080"
    preserveAspectRatio="xMidYMid slice"
>

    <defs>

        <!-- Brillo suave -->
        <filter
            id="starGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >
            <feGaussianBlur
                stdDeviation="2.5"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Brillo más intenso -->
        <filter
            id="brightGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%"
        >
            <feGaussianBlur
                stdDeviation="4"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>


