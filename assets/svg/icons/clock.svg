<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 160 160"
    width="160"
    height="160"
>

    <defs>

        <!-- Azul principal -->
        <linearGradient
            id="clockBlue"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#A9DDF8"/>
            <stop offset="100%" stop-color="#609FDB"/>
        </linearGradient>

        <!-- Dorado -->
        <linearGradient
            id="clockGold"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#FFE9A6"/>
            <stop offset="100%" stop-color="#E5B650"/>
        </linearGradient>

        <!-- Fondo -->
        <linearGradient
            id="clockFace"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F4F8FC"/>
        </linearGradient>

        <!-- Sombra -->
        <filter
            id="clockShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="170%"
        >
            <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="5"
                flood-color="#547FA6"
                flood-opacity=".22"
            />
        </filter>

    </defs>


    <!-- =========================================
         CUERPO DEL RELOJ
    ========================================== -->

    <circle
        cx="80"
        cy="82"
        r="52"
        fill="url(#clockFace)"
        stroke="url(#clockBlue)"
        stroke-width="7"
        filter="url(#clockShadow)"
    />


    <!-- =========================================
         BORDE INTERIOR
    ========================================== -->

    <circle
        cx="80"
        cy="82"
        r="42"
        fill="none"
        stroke="#DCECF7"
        stroke-width="2"
    />


    <!-- =========================================
         MARCAS HORARIAS
    ========================================== -->

    <g
        fill="#7BAAD2"
    >

        <circle cx="80" cy="47" r="3"/>
        <circle cx="115" cy="82" r="3"/>
        <circle cx="80" cy="117" r="3"/>
        <circle cx="45" cy="82" r="3"/>

    </g>


    <!-- Marcas pequeñas -->

    <g
        stroke="#B8D8ED"
        stroke-width="2.5"
        stroke-linecap="round"
    >

        <path d="M 98 51 L 96 55"/>
        <path d="M 111 64 L 107 66"/>
        <path d="M 111 100 L 107 98"/>
        <path d="M 98 113 L 96 109"/>
        <path d="M 62 113 L 64 109"/>
        <path d="M 49 100 L 53 98"/>
        <path d="M 49 64 L 53 66"/>
        <path d="M 62 51 L 64 55"/>

    </g>


    <!-- =========================================
         AGUJAS
    ========================================== -->

    <!-- Aguja de la hora -->

    <path
        d="
            M 80 82
            L 80 59
        "
        stroke="#5C86C3"
        stroke-width="6"
        stroke-linecap="round"
    />

    <!-- Aguja de los minutos -->

    <path
        d="
            M 80 82
            L 104 82
        "
        stroke="#5C86C3"
        stroke-width="4"
        stroke-linecap="round"
    />


    <!-- =========================================
         CENTRO
    ========================================== -->

    <circle
        cx="80"
        cy="82"
        r="7"
        fill="url(#clockGold)"
    />

    <circle
        cx="80"
        cy="82"
        r="3"
        fill="#FFF8DC"
    />


    <!-- =========================================
         PEQUEÑOS DESTELLOS
    ========================================== -->

    <g
        fill="#FFE7A0"
    >

        <path
            d="
                M 37 43
                L 40 51
                L 48 54
                L 40 57
                L 37 65
                L 34 57
                L 26 54
                L 34 51
                Z
            "
        />

        <path
            d="
                M 126 108
                L 129 116
                L 137 119
                L 129 122
                L 126 130
                L 123 122
                L 115 119
                L 123 116
                Z
            "
        />

    </g>

</svg>