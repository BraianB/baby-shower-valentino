    <defs>

        <linearGradient
            id="blueConfetti"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#A9DDF8"/>
            <stop offset="100%" stop-color="#579DD0"/>
